name: deploy-staging
on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: checkout
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install -r requirements.txt
          python -m pip install pytest ruff
      
      - name: Check code syntax
        run: python3 -m compileall -q src

      - name: Linter
        run: ruff check src

      ### pytest
      ### Проверяется логика отдельных функций без обращения к реальным OLT и Telegram.

      ###Сборка контейнера через готовый образ Docker Buildx

      #- name: Set up QEMU
      #  uses: docker/setup-qemu-action@v4
      
      #- name: Set up Docker Buildx
      #  uses: docker/setup-buildx-action@v4
  build_and_push_docker_image:
    needs: test
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    env:
      IMAGE_NAME: ghcr.io/akimametov/bdcom-helper-bot
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4        

      - name: Build image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: Docker/Dockerfile
          load: true
          tags: bdcom-helper-bot:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Проверяем синтаксис внутри собранного образа.
      - name: Test image
        run: |
          docker run --rm \
            --entrypoint python \
            bdcom-helper-bot:ci \
            -m compileall -q src

      # Публикуем только после успешной проверки.
      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Tag image
        if: github.event_name != 'pull_request'
        run: |
          docker tag bdcom-helper-bot:ci \
            "$IMAGE_NAME:${GITHUB_SHA}"

      - name: Push image
        if: github.event_name != 'pull_request'
        run: |
          docker push "$IMAGE_NAME:${GITHUB_SHA}"
