name: deploy-staging
on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: checkout
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install -r requirements.txt
          python -m pip install pytest ruff
      
      - name: Check code syntax
        run: python3 -m compileall -q src

      - name: Linter
        run: ruff check src

      ### pytest
      ### Проверяется логика отдельных функций без обращения к реальным OLT и Telegram.

###Сборка контейнера через готовый образ Docker Buildx

  build_and_push_docker_image:
    needs: test
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    env:
      IMAGE_NAME: ghcr.io/akimametov/bdcom-helper-bot
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4        

      - name: Build image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: Docker/Dockerfile
          load: true
          tags: bdcom-helper-bot:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Проверяем синтаксис внутри собранного образа.
      - name: Test image
        run: |
          docker run --rm \
            --entrypoint python \
            bdcom-helper-bot:ci \
            -m compileall -q src

      # Публикуем только после успешной проверки.
      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Tag image
        if: github.event_name != 'pull_request'
        run: |
          docker tag bdcom-helper-bot:ci \
            "$IMAGE_NAME:${GITHUB_SHA}"

      - name: Push image
        if: github.event_name != 'pull_request'
        run: |
          docker push "$IMAGE_NAME:${GITHUB_SHA}"


  deploy-staging:
    needs: build_and_push_docker_image
    runs-on: ubuntu-latest

    steps:
      - name: Configure SSH
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.SSH_KNOWN_HOSTS }}
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          printf '%s\n' "$SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts

      - name: Deploy to staging
        env:
          STAGING_HOST: ${{ secrets.SERVER_HOST }}
          STAGING_USER: ${{ secrets.SERVER_USER }}
          STAGING_PORT: ${{ secrets.SERVER_PORT }}
          IMAGE: ghcr.io/akimametov/bdcom-helper-bot:${{ github.sha }}
        run: |
          ssh -p "$STAGING_PORT" \
            "$STAGING_USER@$STAGING_HOST" \
            "IMAGE='$IMAGE' bash -s" <<'REMOTE'
          set -eu

          cd /opt/onu-bot
          docker pull "$IMAGE"

          docker rm -f bdcom-helper-bot 2>/dev/null || true

          docker run -d \
            --name bdcom-helper-bot \
            --restart unless-stopped \
            --env-file /opt/onu-bot/.env \
            -v /opt/onu-bot/IP-devices.xlsx:/usr/src/app/IP-devices.xlsx:ro \
            "$IMAGE"
          REMOTE