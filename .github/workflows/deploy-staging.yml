name: deploy-staging
on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: checkout
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install -r requirements.txt
          python -m pip install pytest ruff
      
      - name: Check code syntax
        run: python3 -m compileall -q src

      - name: Linter
        run: ruff check src

      ### pytest
      ### Проверяется логика отдельных функций без обращения к реальным OLT и Telegram.

      ###Сборка контейнера через готовый образ Docker Buildx
