name: Roll back to a previous version of the image
on:
    workflow_dispatch:

jobs:
    Deploy_previous_version:
        runs-on: ubuntu-latest

        steps:
          - name: Checkout
            uses: actions/checkout@v7

          - name: Install SSH-private key and known host
            run: |
                mkdir -p ~/.ssh
                echo "${{ secrets.PROD_PRIVATE_KEY }}" > ~/.ssh/id_ed25519
                chmod 600 ~/.ssh/id_ed25519
                echo "${{ secrets.PROD_KNOWN_HOSTS }}" >> ~/.ssh/known_hosts
                chmod 644 ~/.ssh/known_hosts

          - name: Deploy previous version
            run: |
                PREVIOUS_COMMIT_HASH="$(git rev-parse HEAD^2)"
                ssh -p ${{secrets.PROD_SSH_PORT}} ${{ secrets.PROD_USER }}@${{secrets.PROD_HOST}} <<'EOF'
                set -eu
                docker stop bdcom-helper-bot 2>/dev/null || true
                docker rm bdcom-helper-bot 2>/dev/null || true
                IMAGE="ghcr.io/${{ github.repository_owner }}/bdcom-helper-bot:$PREVIOUS_COMMIT_HASH"
                docker pull "$IMAGE"
                cd /opt/BDCOMHelperBot/
                docker run -d --restart unless-stopped --name bdcom-helper-bot --env-file .env -v ./IP-devices.xlsx:/usr/src/app/IP-devices.xlsx "$IMAGE"                  
                EOF