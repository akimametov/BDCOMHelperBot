- name: Configure a server for application deployment
  hosts: localhost
  become: true

  vars:
    app_path: "/opt/BDCOMHelperBot"
    deploy_user: "github-deploy"
    developers_group: "developers"

  tasks:
    - name: Download Docker-installer script
      ansible.builtin.get_url:
        url: https://get.docker.com
        dest: /root/get-docker.sh
        mode: '0755'

    - name: Install Docker
      ansible.builtin.command:
        cmd: /root/get-docker.sh
        creates: /usr/bin/docker

    - name: Create user group
      ansible.builtin.group:
        name: "{{ developers_group }}"
        state: present

    - name: Create deploy-user
      ansible.builtin.user:
        name: "{{ deploy_user }}"
        create_home: false
        shell: /bin/bash
        groups:
          - "{{ developers_group }}"
          - docker
        append: true
        state: present

    - name: Create application directory
      ansible.builtin.file:
        state: directory
        path: "{{ app_path }}"
        mode: '0755'
        owner: root
        group: "{{ developers_group }}"

    - name: Copy files .env and IP-devices.xlsx in application directory
      ansible.builtin.copy:
        src: files/
        dest: "{{ app_path }}"
        mode: "0600"
        owner: "{{ deploy_user }}"
        group: "{{ developers_group }}"

    - name: Create directory for SSH-keys
      ansible.builtin.file:
        state: directory
        path: /etc/ssh/authorized_keys/
        mode: '0755'
        owner: root
        group: root

    - name: Generate SSH-keys
      community.crypto.openssh_keypair:
        path: /etc/ssh/authorized_keys/{{ deploy_user }}_ed25519
        type: ed25519
        owner: "{{ deploy_user }}"
        group: root
        mode: '0600'
        comment: "{{ deploy_user }}"

    - name: Add SSH-config for deploy-user
      ansible.builtin.blockinfile:
        path: /etc/ssh/sshd_config
        block: |
          Match User github-deploy
            AuthorizedKeysFile /etc/ssh/authorized_keys/{{ deploy_user }}_ed25519.pub
            PubkeyAuthentication yes
            PasswordAuthentication no
            KbdInteractiveAuthentication no
        validate: /usr/sbin/sshd -t -f %s
      notify: Restart sshd

    - name: Read host public key
      ansible.builtin.slurp:
        src: /etc/ssh/ssh_host_ed25519_key.pub
      register: host_public_key

    - name: Message
      ansible.builtin.debug:
        msg:
          - "Публичный ключ хоста: {{ (host_public_key.content | b64decode).split()[:2] | join(' ') }}"
          - "Приватный SSH-ключ для пользователя {{ deploy_user }} в директории /etc/ssh/authorized_keys/"

  handlers:
    - name: Restart sshd
      ansible.builtin.service:
        name: sshd
        state: restarted